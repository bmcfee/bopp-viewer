name: CI - JupyterLab Extension & BOPP Visualizer

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Generate TypeScript types from BOPP JSON Schemas
        run: npm run generate:types

      - name: Typecheck codebase (tsc --noEmit)
        run: npm run lint

  test-frontend-extension:
    name: Build & Test JupyterLab Extension Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Compile and bundle JupyterLab extension
        run: npm run build:prod

      - name: Run test suite (BOPP Parser, Schemas, Vega-Lite & Extension Bundle)
        run: npm test

      - name: Verify JupyterLab prebuilt labextension assets
        run: |
          test -f lib/index.js || (echo "Missing lib/index.js bundle" && exit 1)
          test -f jupyterlab_bopp/labextension/package.json || (echo "Missing labextension/package.json" && exit 1)
          test -f jupyterlab_bopp/labextension/install.json || (echo "Missing labextension/install.json" && exit 1)
          test -d jupyterlab_bopp/labextension/static || (echo "Missing labextension/static directory" && exit 1)
          echo "All JupyterLab extension prebuilt assets verified successfully."

  test-python-jupyterlab:
    name: JupyterLab 4 Python Packaging & Install Verification (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-types]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Python build tools and JupyterLab 4
        run: |
          python -m pip install --upgrade pip
          pip install build wheel hatchling hatch-jupyter-builder "jupyterlab>=4.0.0,<5"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Python sdist and wheel packages
        run: python -m build --sdist --wheel .

      - name: Inspect generated distribution artifacts
        run: |
          ls -la dist/
          tar -ztvf dist/*.tar.gz | grep "jupyterlab_bopp" || true

      - name: Install built wheel into Python environment
        run: |
          pip install dist/jupyterlab_bopp-*.whl

      - name: Verify Python package import and JupyterLab extension hooks
        run: |
          python -c "import jupyterlab_bopp; paths = jupyterlab_bopp._jupyter_labextension_paths(); print('Labextension paths:', paths); assert len(paths) == 1; assert paths[0]['dest'] == 'jupyterlab-bopp'"

      - name: Verify JupyterLab discovers and validates the prebuilt extension
        run: |
          echo "=== JupyterLab Extension List ==="
          jupyter labextension list
          jupyter labextension list 2>&1 | grep -E "jupyterlab-bopp.*OK" || (echo "jupyterlab-bopp extension not recognized as OK" && exit 1)

      - name: Verify extension status with jupyter labextension check
        run: |
          jupyter labextension check --debug jupyterlab-bopp
